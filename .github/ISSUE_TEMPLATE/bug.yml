name: Bug Report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please complete the fields below so we can reproduce the issue quickly.

        Do **not** include database credentials, API secrets, production records, or customer data.

  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: Provide the package version that you are using.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
      description: Provide the Laravel version that you are using.
      placeholder: 13.0.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: Provide the PHP version that you are using.
      placeholder: 8.3.0
    validations:
      required: true

  - type: input
    id: database-driver
    attributes:
      label: Database Driver
      description: Provide the database driver and version if relevant.
      placeholder: mysql 8.4, pgsql 16, sqlite
    validations:
      required: false

  - type: input
    id: affected-model
    attributes:
      label: Affected Model
      description: Provide the Eloquent model class or table involved.
      placeholder: App\Models\User
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Command Executed
      description: Provide the exact Artisan command you ran.
      placeholder: php artisan schema-contract:check User
    validations:
      required: false

  - type: textarea
    id: schema-definition
    attributes:
      label: Schema Definition
      description: Provide the relevant migration or schema snippet (structure only, no row data).
      placeholder: "$table->boolean('active');"
    validations:
      required: false

  - type: textarea
    id: cast-definition
    attributes:
      label: Cast Definition
      description: Provide the relevant model cast configuration.
      placeholder: "'active' => 'integer'"
    validations:
      required: false

  - type: textarea
    id: actual-result
    attributes:
      label: Actual Result
      description: What happened, including command output if helpful.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Provide detailed steps to reproduce. A minimal reproduction repository is helpful when possible.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any other context that might help diagnose the issue.
    validations:
      required: false
